name: Import travel photos
on:
  push:
    branches: [main]
    paths:
      - 'photo-inbox/**'
      - 'scripts/import_travel_photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=10,<12"
      - run: python scripts/import_travel_photos.py
      - name: Commit optimized photos and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photo-inbox images/travel data/photo-manifest.js
          if ! git diff --cached --quiet; then
            git commit -m "Import optimized travel photos"
            git push
          fi
